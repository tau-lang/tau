[package]
name = "tau-generator-llvm"
version = "0.1.0"
authors = ["Karl Zschiebsch"]
edition = "2024"

description = "A LLVM intermediate language generator for the Tau compiler."
readme = "README.md"
license-file = "../LICENSE"
homepage = "https://codeberg.org/tau-lang"
repository = "https://codeberg.org/tau-lang/tau"
keywords = ["tau-lang", "llvm"]

[dependencies]
tau-lang-core = { workspace = true }
symbol_table = { workspace = true }

[target.'cfg(windows)'.dependencies]
inkwell = { workspace = true, features = ["target-x86"] }

[target.'cfg(not(windows))'.dependencies]
inkwell = { workspace = true, features = ["target-all"] }
