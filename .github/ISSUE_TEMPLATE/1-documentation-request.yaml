name: "Documentation request"
description: "Report missing or incorrect documentation in the Tau manuals."
title: "docs: LOCATION"
labels: ["documentation"]
body:
  - type: "markdown"
    attributes:
      value: |
        <p align="center">
          <h1>Tau</h1>
        </p>

        Welcome to Tau. Please replace the **`docs: LOCATION`** template above with the location of the file, module or function that needs documentation.

        ---
  - type: "textarea"
    id: "description"
    attributes:
      label: "Describe the problem"
      description: "Please include a clear and concise description of what the issue is."
    validations:
      required: true
  - type: "textarea"
    id: "proposal"
    attributes:
      label: "Proposed solution"
      description: |
        If possible, please draft a tentative documentation chapter to resolve this issue.
        Your proposal should be written in CommonMark Markdown.
      render: "markdown"
    validations:
      required: false
  - type: "markdown"
    attributes:
      value: |
        ## Thank you for helping improve Tau!
